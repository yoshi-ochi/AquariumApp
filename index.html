<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe6ff" />
    <title>アクアリウム・ビルダー</title>
  </head>
  <body>
    <!-- スプラッシュ -->
    <div id="splash">
      <canvas id="splash-canvas"></canvas>
      <div class="splash-ui">
        <h1>アクアリウム・ビルダー</h1>
        <div class="progress"><div id="splash-bar"></div></div>
        <p id="splash-label">準備中…</p>
        <form id="gate" hidden onsubmit="return false">
          <input id="gate-password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="パスワード" aria-label="パスワード" />
          <button id="gate-submit" type="button">入る</button>
          <p id="gate-message"></p>
        </form>
      </div>
    </div>

    <!-- 3Dビューポート -->
    <div id="viewport"></div>

    <!-- 上部オーバーレイ -->
    <div id="top-bar">
      <div class="slot">
        <button id="btn-menu" class="icon" aria-label="メニュー">☰</button>
        <button id="btn-back" class="icon" aria-label="戻る" hidden>←</button>
      </div>
      <div id="mode-title"></div>
      <div class="slot right">
        <button id="btn-edit" class="icon accent" aria-label="編集">✎</button>
        <button id="btn-done" class="pill accent" hidden>完了</button>
      </div>
    </div>

    <!-- メニュー（階・拡張・保存/読込） -->
    <div id="menu-sheet" hidden>
      <div class="menu-row stats" id="menu-stats"></div>
      <div class="menu-row">
        <span>フロア</span>
        <div class="floor-ctl">
          <button id="floor-down">▼</button>
          <b id="floor-label">1F</b>
          <button id="floor-up">▲</button>
        </div>
      </div>
      <div class="menu-row"><span id="menu-stage"></span><button id="btn-upgrade" class="primary">拡張</button></div>
      <div class="menu-row" id="cloud-row" hidden>
        <span>クラウド</span>
        <button id="btn-cloud-save" class="primary">☁ 保存</button>
        <button id="btn-cloud-load">☁ 読込</button>
      </div>
      <div class="menu-row">
        <span>ファイル</span>
        <button id="btn-save">保存</button>
        <button id="btn-load">読込</button>
        <input id="file-load" type="file" accept="application/json,.json" hidden />
      </div>
    </div>

    <!-- 選択オブジェ上のギズモ -->
    <div id="gizmo" hidden>
      <button data-action="rotate-left" aria-label="左回転">⟲</button>
      <button data-action="rotate-right" aria-label="右回転">⟳</button>
      <button data-action="interior" class="only-tank" aria-label="水槽内編集">✎</button>
      <button data-action="lock" class="only-interior lock-btn" aria-label="ロック"><svg class="lock-ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path class="shackle" d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      <button data-action="delete" class="danger" aria-label="削除">🗑</button>
    </div>

    <!-- 編集用ボトムシート -->
    <section id="editor" hidden>
      <aside id="detail-panel" hidden></aside>
      <nav id="catalog-tabs"></nav>
      <div id="catalog-cards"></div>
      <div id="room-panel" hidden></div>
    </section>

    <div id="hint"></div>
    <div id="toast"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
